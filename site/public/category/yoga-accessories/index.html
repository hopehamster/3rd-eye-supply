      "name": "What thickness of yoga mat is best?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "4-6mm is the standard range for most practice. Thinner (2-3mm) suits balance-focused, alignment-heavy practice (the floor feedback is crisper). Thicker (6-8mm) suits restorative, meditation, and long holds where joint cushioning matters more than ground feel. 6mm is a strong middle-ground for mixed practice."
      }
    },
    {
      "@type": "Question",
      "name": "How do I clean a yoga mat?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Wipe down after each practice with a soft cloth and a 1:1 water + white-vinegar mix (or a gentle mat-spray). Once a month, lay the mat flat in a tub, rinse with lukewarm water, hand-scrub gently, and air-dry flat — never machine-wash, never tumble-dry. Sun-bleaching is okay in moderation; prolonged sun degrades the surface."
      }
    },
    {
      "@type": "Question",
      "name": "Why does my mat slide around on hardwood floors?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Hardwood is too smooth for most rubber-soled mats. Try a thin cotton rug under the mat, a yoga-towel layer on top, or a textured mat with a stickier underside. Sweat also helps — many practitioners report mats grip better in their second week of regular use."
      }
    },
    {
      "@type": "Question",
      "name": "How do I store a yoga mat?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Roll it loosely (rolled too tight, the surface curls); store standing on end or hanging over a closet bar. Avoid storing in a closed car (heat warps PVC), in the bathroom (humidity), or with the rolled side facing direct sun for long periods."
      }
    },
    {
      "@type": "Question",
      "name": "What's the difference between PVC, TPE, and rubber yoga mats?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "PVC mats are sticky, durable, and inexpensive — but not biodegradable. TPE mats are lighter, recyclable, and gentler on joints. Natural-rubber mats grip exceptionally well and biodegrade — but smell strong out of the box and weigh more. Pick by priority: durability (PVC), eco-load (TPE), grip (rubber)."
      }
    },
    {
      "@type": "Question",
      "name": "Do I need props beyond a mat?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "For early practice — no. As practice develops, blocks (for lengthening reach in poses), straps (for safer flexibility work), bolsters (for restorative and yin practice), and a meditation cushion become useful. Add one prop at a time as a specific class style requires it."
      }
    }
