      "name": "What's the difference between essential oils and fragrance oils?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Essential oils are distilled directly from plants and carry the plant's natural aromatic chemistry — they cost more, vary slightly batch to batch, and often have traditional therapeutic associations. Fragrance oils are synthetic blends formulated to smell like a target scent; consistent, cheaper, and not interchangeable with essential oils for traditional practice."
      }
    },

      "@type": "Question",
      "name": "How do I use an essential-oil diffuser?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Fill the reservoir with clean water to the marked line, add 3-8 drops of essential oil (start small — concentrated oils go far), close the lid, and switch on. Most ultrasonic diffusers run 2-6 hours per fill. Run in a ventilated room; avoid leaving on overnight in sealed bedrooms."
      }
    },
    {
      "@type": "Question",
      "name": "Which essential oil is best for sleep?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Lavender is the most-cited oil for restful sleep, often paired with chamomile, bergamot, or cedarwood for added depth. Diffuse 30-60 minutes before bed in a ventilated bedroom — turn the diffuser off when you go to sleep rather than running it continuously."
      }
    },
    {
      "@type": "Question",
      "name": "Are essential oils safe around pets?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Several essential oils are toxic to cats and dogs — including tea tree, eucalyptus, citrus, and pine — even when diffused. Birds are especially sensitive to any aromatic diffusion. If you live with pets, research the specific oil before diffusing in shared space, and always provide an exit route to an unscented room."
      }
    },
    {
      "@type": "Question",
      "name": "How do I clean my diffuser?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Empty after each use. Once a week, run a cycle with water and a tablespoon of white vinegar, then rinse thoroughly with clean water. Wipe the ultrasonic disc gently with a cotton swab — never use abrasive cleaners or scrub the disc with a hard brush."
      }
    },
