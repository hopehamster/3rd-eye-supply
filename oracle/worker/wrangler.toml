# wrangler.toml — Oracle Worker (3rd Eye Supply metaphysical assistant)
#
# Sibling config to the existing CJ workers. NOT merged into the root wrangler
# config — Oracle deploys as its own worker so least-privilege bindings stay
# enforceable (no CJ secrets, no Snipcart, no order-write authority).
#
# Provisioning order before first deploy:
#   1. wrangler kv:namespace create ORACLE_SESSIONS
#   2. wrangler kv:namespace create ORACLE_CACHE
#   3. (Paste returned IDs into the [[kv_namespaces]] entries below.)
#   4. wrangler vectorize create oracle-knowledge --dimensions=768 --metric=cosine
#   5. wrangler secret put ANTHROPIC_API_KEY  --name oracle-worker
#   6. wrangler secret put MINIMAX_API_KEY    --name oracle-worker
#   7. wrangler secret put MINIMAX_GROUP_ID   --name oracle-worker
#   8. wrangler deploy --dry-run             # sanity check
#   9. wrangler deploy                       # the real thing

name = "oracle-worker"
main = "oracle-worker.js"
compatibility_date = "2026-05-05"
workers_dev = true

# ---------------------------------------------------------------------------
# Non-secret config — adjust without redeploy via `wrangler vars` if needed.
# ---------------------------------------------------------------------------
[vars]
ORACLE_MODEL              = "claude-haiku-4-5-20251001"
ORACLE_MAX_TURNS          = "12"
ORACLE_MAX_TOKENS         = "600"
MAX_CONV_PER_IP_PER_DAY   = "8"

# MiniMax voice fingerprint. "English_Graceful_Lady" is the documented
# System Voice closest to the Oracle persona spec ("wise woman at the
# threshold, low warm intimate cadence"). Override at runtime to A/B
# without code changes.
ORACLE_VOICE_ID           = "English_Graceful_Lady"
MINIMAX_MODEL             = "speech-02-hd"

# CORS allowlist. Production canonical FIRST.
ALLOWED_ORIGINS = "https://3rdeyesupply.com,https://www.3rdeyesupply.com,https://hopehamster.github.io,http://localhost:4321,http://localhost:3000,http://localhost:8787"

# ---------------------------------------------------------------------------
# KV bindings
# ---------------------------------------------------------------------------

# Existing PRODUCTS KV — read-only from Oracle. ID from PROJECT_PLAYBOOK.
[[kv_namespaces]]
binding = "PRODUCTS"
id      = "068e6599412e40659fd403e54f5fac55"

# NEW — must be created before first deploy (`wrangler kv:namespace create`).
[[kv_namespaces]]
binding = "ORACLE_SESSIONS"
id      = "REPLACE_AFTER_wrangler_kv_namespace_create_ORACLE_SESSIONS"

[[kv_namespaces]]
binding = "ORACLE_CACHE"
id      = "REPLACE_AFTER_wrangler_kv_namespace_create_ORACLE_CACHE"

# ---------------------------------------------------------------------------
# Workers AI binding (embeddings via @cf/baai/bge-base-en-v1.5)
# ---------------------------------------------------------------------------
[ai]
binding = "AI"

# ---------------------------------------------------------------------------
# Vectorize binding — RAG knowledge base (42-book corpus)
# Index does NOT have to exist on first deploy — the worker degrades gracefully
# to product-only RAG if ORACLE_VECTORS isn't bound or returns no matches.
# Create with: wrangler vectorize create oracle-knowledge --dimensions=768 --metric=cosine
# ---------------------------------------------------------------------------
[[vectorize]]
binding    = "ORACLE_VECTORS"
index_name = "oracle-knowledge"

# ---------------------------------------------------------------------------
# Routes — production canonical 3rdeyesupply.com PLUS transitional GH Pages
# proxy path. Custom domain route requires zone ownership of 3rdeyesupply.com
# (already in this Cloudflare account per PROJECT_PLAYBOOK).
# ---------------------------------------------------------------------------
[[routes]]
pattern = "3rdeyesupply.com/api/oracle/*"
zone_name = "3rdeyesupply.com"

[[routes]]
pattern = "www.3rdeyesupply.com/api/oracle/*"
zone_name = "3rdeyesupply.com"

# Note: hopehamster.github.io is GitHub Pages, NOT a Cloudflare zone — the
# worker can't be routed there. The Astro site running on GH Pages calls the
# worker at its workers.dev URL or at oracle.3rdeyesupply.com directly.
# Documented here, not declared as a route.
#   workers.dev URL: https://oracle-worker.<account>.workers.dev/oracle/*
#   custom (preferred): https://3rdeyesupply.com/api/oracle/*

# ---------------------------------------------------------------------------
# Secrets (declared in code via env.<NAME>; injected via `wrangler secret put`)
# DO NOT paste secret values into this file. Listed here as a checklist:
#   - ANTHROPIC_API_KEY     (Anthropic console)
#   - MINIMAX_API_KEY       (MiniMax developer console)
#   - MINIMAX_GROUP_ID      (MiniMax org identifier)
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Observability — keep logs for debugging during early deploy.
# ---------------------------------------------------------------------------
[observability]
enabled = true
