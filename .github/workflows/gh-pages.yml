name: Deploy Astro to GitHub Pages
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: 'pages'
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package.json

      - name: Install deps
        working-directory: site
        run: npm ci || npm install

      - name: Build
        working-directory: site
        run: npx astro build

      - name: Pre-deploy path sanity (block bad asset paths)
        run: |
          set -e
          if grep -R "href=\"_astro/" site/dist || grep -R "src=\"images/" site/dist || grep -R "srcset=\"images/" site/dist; then
            echo "Found non-prefixed asset paths (should start with /3rd-eye-supply/)." >&2
            exit 1
          else
            echo "Asset paths look correct."
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site/dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Post-deploy smoke test (200 checks)
        run: |
          set -e
          urls=(
            "https://hopehamster.github.io/3rd-eye-supply/"
            "https://hopehamster.github.io/3rd-eye-supply/_astro/about.Km8tFqjv.css"
            "https://hopehamster.github.io/3rd-eye-supply/images/pyramids/bulkresizephotos.com_pyramids-4-sided-1-cover.webp"
          )
          for u in "${urls[@]}"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$u")
            if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
              echo "OK $u $code"
            else
              echo "FAIL $u $code" >&2
              exit 1
            fi
          done

  linkcheck:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Link checker (lychee) against deployed site
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --no-progress --accept 200..399 --max-retries 3 --retry-wait-time 2 https://hopehamster.github.io/3rd-eye-supply/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
